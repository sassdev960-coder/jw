<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Inner Gold Plaque -->
  <g filter="url(#goldGlow)">
    <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#goldGrad)" />
    <rect x="108" y="108" width="296" height="296" rx="52" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />
  </g>

  <!-- JW Typography -->
  <text x="256" y="280" font-family="'Cinzel', 'Times New Roman', 'Playfair Display', serif" font-size="140" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="4">JW</text>
  
  <!-- Subtle subtitle -->
  <text x="256" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="6">ASIGNACIONES</text>
</svg>
